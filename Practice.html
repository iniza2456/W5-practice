<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 525px;
    margin: auto;
    background-color: #56849a;
    padding: 20px;
}

form {
    background-color: white;
    border-radius: 8px;
    overflow: hidden;
}

/* Header */
.header {
    background-color: #f0f1f1;
    text-align: center;
    padding: 15px;
    border-bottom: 1px solid #ddd;
}

.header h2 {
    margin: 0;
    color: #666;
    font-size: 22px;
}

/* Form Body */
.form-body {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px 10px;
    padding: 25px 30px;
}

.field {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.field > label {
    color: #00b894;
    font-size: 13px;
    font-weight: bold;
}

.field > input:not([type="file"]),
.field select,
.field textarea {
    width: 100%;
    padding: 5px 7px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 13px;
}

input::placeholder {
    color: #ccc;
}

.full-width {
    grid-column: 1 / -1;
}

/* Gender and Hobbies */
.options {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
}

.options label {
    color: #555;
    font-size: 12px;
    font-weight: normal;
}

.options input {
    margin: 0 2px 0 0;
    accent-color: #00b894;
}

/* Income Slider */
.income-box {
    display: flex;
    align-items: center;
    gap: 5px;
}

.income-box input {
    flex: 1;
    min-width: 0;
    accent-color: #00b894;
}

.income-box span {
    background-color: #00b894;
    color: white;
    padding: 4px;
    border-radius: 3px;
    font-size: 12px;
}

/* File Upload */
input[type="file"] {
    font-size: 12px;
    max-width: 100%;
}

/* Bio */
textarea {
    resize: vertical;
    min-height: 65px;
}

/* Focus */
input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #00b894;
}

/* Footer */
.footer {
    display: flex;
    justify-content: flex-end;
    background-color: #f0f1f1;
    border-top: 1px solid #ddd;
    padding: 8px 30px;
}

button {
    background-color: #00b894;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    cursor: pointer;
}

button:hover {
    background-color: #008f72;
}

/* Responsive */
@media (max-width: 480px) {
    .form-body {
        grid-template-columns: 1fr;
        padding: 20px;
    }

    .full-width {
        grid-column: auto;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <form >
            <div class="header">
                <h2>Create account</h2>
            </div>
            <div class="form-body">
            <!-- Your inputs here -->
             <div class="field">
                <LABEL class="firstName">firstName</LABEL>
                <input type="text" id="firstName" placeholder="enter your first name" required>
             </div>

             <div class="field">
                <label for="lastName">lastName</label>
                <input type="text" id="lastName" placeholder="enter your last name" required>
             </div>

             <div class="field full-width">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="enter your email" required>
             </div>
             <div class="field">
                <label for="password">Password *</label>
                <input type="password" id="password"
                       placeholder="enter your password" required>
            </div>
            <div class="field">
                <label for="confirmPassword">
                    Confirm Password *
                </label>
                <input type="password" id="confirmPassword"
                       placeholder="enter your password again" required>
            </div>
            
             <div class="field">
                <label>Gender:</label>
                <div class="options">
                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>
                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>
                </div>
            </div>
            <div class="field">
                <label for="">Hobbies</label>
                <div class="options">
                    <label for=""><input type="checkbox">Music</label>
                    <label for=""><input type="checkbox">Sports</label>
                    <label for=""><input type="checkbox">Travel</label>
                    <label for=""><input type="checkbox">Movies</label>

                </div>

            </div>
             <div class="field">
                <label for="source">Source of Income</label>
                <select id="source">
                    <option>Employed</option>
                    <option>Self-employed</option>
                    <option>Student</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="field">
                <label for="income">Income</label>
                <div class="income-box">
                    <input type="range" id="income"
                           min="0" max="100" value="20">
                    <span id="incomeValue">20K</span>
                </div>
            </div>
            <div class="field">
                <label for="picture">Upload Profile Picture</label>
                <input type="file" id="picture">
            </div>
            <div class="field">
                <label for="age">Age</label>
                <input type="number" id="age"
                       value="18" min="1">
            </div>
             <div class="field full-width">
                <label for="bio">Bio</label>
                <textarea id="bio" rows="4"></textarea>
            </div>
            <div class="footer">
            <button type="submit">Create</button>
            </div>
            </div>
        <div class="footer">
            <button type="submit">Create</button>
        </div>
        </form>
    </div>
</body>
</html>
